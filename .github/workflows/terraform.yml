#=====================================
#特定のコードをデプロイ
#=====================================

name: Terraform

on:
  pull_request:
    paths:
      - 'codes/**'

  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      target:
        description: "Terraform Target"
        required: false
        type: string
          

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.8.5"
  TF_REGISTRY_CLIENT_TIMEOUT: "60"
  TF_REGISTRY_DISCOVERY_RETRY: "5"
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-plan:
    if: |
      github.event_name == 'pull_request' &&
      (github.base_ref == 'dev' ||
       github.base_ref == 'stage' ||
       github.base_ref == 'prod')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set working directory
        run: |
          case "${{ github.base_ref }}" in
            dev)
              echo "WORKDIR=./codes/Dev" >> $GITHUB_ENV
              ;;
            stage)
              echo "WORKDIR=./codes/Stage" >> $GITHUB_ENV
              ;;
            prod)
              echo "WORKDIR=./codes/Prod" >> $GITHUB_ENV
              ;;
          esac

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Init
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          for i in 1 2 3; do
            if terraform init; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "terraform init failed (attempt $i). Retrying..."
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts."
          exit 1

      - name: Terraform Fmt
        working-directory: ${{ env.WORKDIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate

      - name: TFLint
        working-directory: ${{ env.WORKDIR }}
        run: |
          tflint --init
          tflint

      - name: Terraform Plan
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan
          echo "plan exit code=$?"
          ls -la
          terraform show -no-color tfplan > plan.txt
          echo "show exit code=$?"

      - name: Comment Plan Result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              '${{ env.WORKDIR }}/plan.txt',
              'utf8'
            );

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body:
                "## Terraform Plan Result\n```terraform\n" +
                plan.substring(0, 65000) +
                "\n```"
            });

  terraform-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set working directory
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)
              echo "WORKDIR=./codes/Dev" >> $GITHUB_ENV
              ;;
            stage)
              echo "WORKDIR=./codes/Stage" >> $GITHUB_ENV
              ;;
            prod)
              echo "WORKDIR=./codes/Prod" >> $GITHUB_ENV
              ;;
          esac

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          for i in 1 2 3; do
            if terraform init; then
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "terraform init failed (attempt $i). Retrying..."
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts."
          exit 1

      - name: Terraform Validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            terraform plan \
              -target=${{ github.event.inputs.target }} \
              -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Terraform Apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply tfplan
